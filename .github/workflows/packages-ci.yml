name: Pyrite Packages CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  packages-style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package formatting
        run: npm run format

      - name: Lint packages
        run: npm run lint

      - name: Test packages
        run: npm run test
